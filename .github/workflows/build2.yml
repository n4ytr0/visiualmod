name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uloz pliki w foldery
        run: |
          mkdir -p src/main/java/pl/visuals/mixin src/main/resources/assets/visualsmod/lang
          [ -f EntityMixin.java ] && mv EntityMixin.java src/main/java/pl/visuals/mixin/ || true
          for f in VisualsConfig VisualsMod VisualsRenderer VisualsScreen TargetFinder; do
            [ -f $f.java ] && mv $f.java src/main/java/pl/visuals/ || true
          done
          [ -f fabric.mod.json ] && mv fabric.mod.json src/main/resources/ || true
          [ -f visualsmod.mixins.json ] && mv visualsmod.mixins.json src/main/resources/ || true
          [ -f en_us.json ] && mv en_us.json src/main/resources/assets/visualsmod/lang/ || true
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: visualsmod
          path: build/libs/*.jar
